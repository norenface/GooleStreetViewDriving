plugins {
    id 'com.android.application'
}

android {
    namespace 'com.innovation.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.innovation.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            assets {
                srcDirs = ['src/main/assets']
            }
        }
    }
}

dependencies {
    // WebView は Android SDK 標準ライブラリのため追加依存なし
}
