plugins {
    id 'com.android.application'
}

android {
    namespace 'com.streetviewhyperlapse'
    compileSdk 34

    defaultConfig {
        applicationId "com.streetviewhyperlapse"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            assets {
                srcDirs = ['../../innovation/web']
            }
        }
    }
}

dependencies {
    // WebView は Android SDK 標準ライブラリのため追加依存なし
    // ローカル HTTP サーバー (WebRTC は file:// では動作しないため http://localhost で提供)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
