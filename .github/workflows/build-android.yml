name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # 1. Web アプリ ビルド
  # ──────────────────────────────────────────────
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate & build
        working-directory: web
        run: node build.js

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. Android APK ビルド
  # ──────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # GitHub Actions ubuntu-latest には Android SDK が
      # 事前インストール済み (ANDROID_HOME が設定されている)
      - name: Install required SDK components
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            2>&1 | grep -v "^\[=" || true

      # web/ の内容を Android assets/ にコピー
      - name: Sync web assets → Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r web/. android/app/src/main/assets/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: |
          find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreetViewHyperlapse-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ──────────────────────────────────────────────
  # 3. Release APK (main ブランチ・署名キー設定時のみ)
  # ──────────────────────────────────────────────
  build-android-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: build-android
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      secrets.KEYSTORE_BASE64 != ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Sync web assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r web/. android/app/src/main/assets/

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.jks

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: StreetViewHyperlapse-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
