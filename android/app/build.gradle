plugins {
    id 'com.android.application'
}

android {
    namespace 'com.streetviewhyperlapse'
    compileSdk 34

    defaultConfig {
        applicationId "com.streetviewhyperlapse"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            assets {
                srcDirs = ['../../innovation/web']
            }
        }
    }
}

dependencies {
    // WebViewAssetLoader: file:// の代わりに https://appassets.androidplatform.net で
    // アセットを配信し、WebRTC (PeerJS) が動作するセキュアコンテキストを提供する
    implementation 'androidx.webkit:webkit:1.8.0'
}
