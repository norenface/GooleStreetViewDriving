<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Innovation</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="setup-screen">
  <h1>Innovation — ソロプレイ / PC対戦</h1>
  <label for="player-count">プレイヤー人数</label>
  <select id="player-count">
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="solo">ソロプレイ（支配政党と対戦）</option>
  </select>
  <div id="opponent-rows"></div>
  <p id="solo-info" class="hidden">ソロプレイ・バリアント：ドロー/メルド/ドグマ発動/達成を行いながら、カードを引いてメルドするだけの自動プレイヤー
    「支配政党（Ruling Party）」と対戦します。支配政党は毎ターン共有の文化トラックを進めてきます。ゲーム終了時に支配政党の得点目標を
    上回れば勝利です。（BGGユーザーGameRulesforOneによるファン考案バリアント。基本セットのカードのみ使用）</p>
  <button id="start-game-btn" class="btn btn-primary" style="margin-top:16px;">ゲーム開始</button>
</div>

<div id="game-screen" class="hidden">
  <div id="game-over-banner" class="hidden"></div>
  <div id="log-panel"></div>
  <div id="players-area"></div>
  <div id="action-bar"></div>
</div>

<div id="modal-overlay" class="hidden">
  <div id="modal-box">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-footer"></div>
  </div>
</div>

<script src="js/engine.js"></script>
<script src="js/cards.js"></script>
<script src="js/effects.js"></script>
<script src="js/flow.js"></script>
<script src="js/soloplay.js"></script>
<script src="js/ui.js"></script>
<script src="js/controllers/humanController.js"></script>
<script src="js/controllers/randomController.js"></script>
<script src="js/controllers/aiController.js"></script>
<script src="js/controllers/soloBotController.js"></script>
<script src="js/app.js"></script>
</body>
</html>
