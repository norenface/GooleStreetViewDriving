name: Deploy Innovation Web to GitHub Pages

on:
  push:
    branches: ["claude/innovation-android-app-2wo4js"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Innovation web app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: innovation/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
